<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>emuzii Copy</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:18px 14px 90px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:25px;margin:0}.badge{font-size:12px;background:#e5e7eb;padding:6px 9px;border-radius:999px}.box,.item{background:white;border-radius:18px;padding:14px;box-shadow:0 2px 10px #0000000d}.box{margin-bottom:15px}textarea{width:100%;min-height:145px;border:1px solid #d1d5db;border-radius:14px;padding:13px;font-size:16px;resize:vertical}button{border:0;border-radius:13px;padding:12px 14px;font-weight:700;font-size:15px}.primary{width:100%;margin-top:10px;background:#111827;color:white}.tools{display:flex;gap:8px;margin:13px 0}.tools button{flex:1;background:white}.item{margin:10px 0}.txt{white-space:pre-wrap;word-break:break-word;max-height:130px;overflow:auto;font-size:15px}.actions{display:flex;gap:7px;margin-top:11px}.copy{flex:1;background:#2563eb;color:white}.pin{background:#f3f4f6}.del{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#6b7280;padding:35px 10px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}small{color:#6b7280}</style></head><body><main class="app"><header><div><h1>emuzii Copy</h1><small>コピペを、もっと簡単に。</small></div><span class="badge">端末内保存</span></header><section class="box"><textarea id="input" placeholder="ここに文章・コード・URLを貼り付け"></textarea><button class="primary" id="save">＋ 保存する</button></section><div class="tools"><button id="paste">📋 貼り付け</button><button id="clear">🗑 全削除</button></div><section id="list"></section></main><div id="toast" class="toast">コピーしました</div><script>
const KEY="emuzii-copy-v1";let data=JSON.parse(localStorage.getItem(KEY)||"[]");const list=document.querySelector("#list"),input=document.querySelector("#input"),toast=document.querySelector("#toast");function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function say(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1300)}async function cp(t){try{await navigator.clipboard.writeText(t);say("コピーしました")}catch{input.value=t;input.select();document.execCommand("copy");say("コピーしました")}}function render(){list.innerHTML="";if(!data.length){list.innerHTML='<div class="empty">保存した文章はここに表示されます</div>';return}data.sort((a,b)=>(b.pin-a.pin)||(b.time-a.time)).forEach(x=>{const el=document.createElement("article");el.className="item";const tx=document.createElement("div");tx.className="txt";tx.textContent=x.text;const ac=document.createElement("div");ac.className="actions";const c=document.createElement("button");c.className="copy";c.textContent="コピー";c.onclick=()=>cp(x.text);const p=document.createElement("button");p.className="pin";p.textContent=x.pin?"★":"☆";p.onclick=()=>{x.pin=!x.pin;persist()};const d=document.createElement("button");d.className="del";d.textContent="削除";d.onclick=()=>{data=data.filter(v=>v.id!==x.id);persist()};ac.append(c,p,d);el.append(tx,ac);list.append(el)})}document.querySelector("#save").onclick=()=>{const t=input.value.trim();if(!t)return say("文章を入力してね");data.unshift({id:Date.now(),text:t,pin:false,time:Date.now()});persist();input.value="";say("保存しました")};document.querySelector("#paste").onclick=async()=>{try{input.value=await navigator.clipboard.readText();say("貼り付けました")}catch{say("入力欄を長押しして貼り付けてね")}};document.querySelector("#clear").onclick=()=>{if(data.length&&confirm("保存した文章を全部削除しますか？")){data=[];persist()}};render();
</script></body></html>
